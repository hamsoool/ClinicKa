server {
  listen 80;
  server_name _;

  # 1. Redirect all HTTP requests to HTTPS automatically
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name _;

  # 2. SSL/TLS Configuration (Uncomment and set paths once you have your certificates)
  # ssl_certificate /etc/ssl/certs/your_domain_certificate.crt;
  # ssl_certificate_key /etc/ssl/private/your_domain_private.key;

  # Enforce modern TLS protocols
  ssl_protocols TLSv1.2 TLSv1.3;
  
  # 3. Strictly enforce AES-256-GCM to meet the academic requirement
  ssl_prefer_server_ciphers on;
  ssl_ciphers "TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384";

  # 4. Ported Security Headers from vercel.json
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co https://res.cloudinary.com https://*.cloudinary.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.cloudinary.com https://res.cloudinary.com https://*.cloudinary.com https://vitals.vercel-insights.com https://*.vercel-insights.com; manifest-src 'self'; worker-src 'self'; form-action 'self'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # SPA Routing: Always serve index.html for unknown paths
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}

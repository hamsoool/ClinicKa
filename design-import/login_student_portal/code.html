<body class="bg-background font-body-md text-body-md text-on-surface antialiased">
<!-- Split Screen Container -->
<div class="min-h-screen flex flex-col lg:flex-row w-full">
<!-- Left Side: Graphic / Branding (Hidden on Mobile) -->
<div class="hidden lg:flex lg:w-1/2 relative bg-surface-container items-center justify-center overflow-hidden">
<!-- Background Image -->
<img class="absolute inset-0 w-full h-full object-cover opacity-80" data-alt="A bright, sunlit view of a modern university campus building featuring clean architectural lines and expansive glass windows. The scene is shot during the day with clear blue skies, conveying a strong sense of academic excellence, orderliness, and reliable institutional authority. The lighting is soft yet crisp, highlighting the modern facade and lush green surroundings, perfectly aligning with a soft-professional, health-tech aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAd3VwXj5OK8iMBqqOqTv48Fh_xNptG3ee5ZdqghkjB8IaP3a5YLn-71b7Gxl4Fw_9PUNwxunKhkfKLRl_aFnPgYGh7-GHSU1lva8H-qtjbTwMNSmkeCUU3Q2l-MQTDTE8FHOkwbZ2eqqno2VJLejqHilJbTswkVkX5OnnF01j8CzM0EttphMup6DGf8yxbYlihttn0ZdnOs5gqs1LT6WIFeYP0tIjczjOR_0Il6ElGeUkO7TfoIQwaoR7r5UBJX4b71OYdanswMx4"/>
<!-- Tonal Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-tr from-on-tertiary-fixed to-transparent opacity-60"></div>
<!-- Branding Overlay -->
<div class="relative z-10 p-12 text-center max-w-lg">
<div class="flex justify-center mb-6">
<div class="w-16 h-16 bg-surface-container-lowest rounded-xl shadow-lg flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
</div>
<h2 class="font-h1 text-h1 text-surface-container-lowest mb-4 drop-shadow-md">Clinic Management System</h2>
<p class="font-body-lg text-body-lg text-inverse-on-surface drop-shadow-sm">Streamlining health records and clinical administrative tasks for the Gordon College student body.</p>
</div>
</div>
<!-- Right Side: Login Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 xl:p-24 bg-surface-container-lowest">
<div class="w-full max-w-md space-y-stack-lg">
<!-- Mobile Branding (Visible only on small screens) -->
<div class="lg:hidden text-center mb-8">
<div class="inline-flex items-center justify-center w-12 h-12 bg-primary-container text-on-primary-container rounded-lg mb-4">
<span class="material-symbols-outlined text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">medical_services</span>
</div>
<h2 class="font-h2 text-h2 text-on-surface">Gordon College</h2>
</div>
<!-- Form Header -->
<div class="text-left mb-8">
<h1 class="font-h1 text-h1 text-on-surface mb-2 tracking-tight">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your Student Portal account.</p>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Email Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="email">Student Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md text-on-surface placeholder-outline focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow duration-200" id="email" name="email" placeholder="student@gordoncollege.edu" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md text-on-surface placeholder-outline focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-shadow duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-4">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember-me">
                                Remember me
                            </label>
</div>
<div class="text-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors duration-200" href="#">
                                Forgot Password?
                            </a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full flex justify-center items-center py-3 px-4 rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-secondary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 active:scale-[0.98]" type="submit">
                            Sign In
                            <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="relative py-4">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-surface-container-lowest px-4 font-label-md text-label-md text-on-surface-variant">Or continue with</span>
</div>
</div>
<!-- Social Login -->
<div>
<button class="w-full flex justify-center items-center gap-3 py-3 px-4 rounded-lg border border-outline-variant bg-surface-container-lowest font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-outline-variant" type="button">
<!-- Standard Google 'G' SVG for visual fidelity of social login requirements -->
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Sign in with Google
                    </button>
</div>
</div>
</div>
</div>
